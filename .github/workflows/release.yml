name: Build Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1"
        required: true
        default: "v0.1"
permissions:
  contents: write
env:
  GODOT_VERSION: "4.7.2-stable"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and Windows export template
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -sL -o godot.zip $base/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          curl -sL -o tpl.tpz $base/Godot_v${GODOT_VERSION}_export_templates.tpz
          d=$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p $d
          unzip -q tpl.tpz "templates/windows_release_x86_64.exe" "templates/version.txt" -d tp
          cp tp/templates/* $d/
      - name: Import and export
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-release "Windows Desktop"
          cd build && zip -9 ../Dorkfall-${{ github.event.inputs.version || github.ref_name }}-windows.zip TopdownTest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "*.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: "*.zip"
          generate_release_notes: true
